name: firebirdadmin-matrix

services:
  fb25:
    image: jacobalberty/firebird:v2.5.9-sc
    platform: linux/amd64
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: firebirdadmin.fdb
    ports:
      - "3025:3050"
    volumes:
      - ./artifacts/firebird-matrix/fb25:/firebird

  fb30:
    image: firebirdsql/firebird:3
    platform: linux/amd64
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: firebirdadmin.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports:
      - "3030:3050"
    volumes:
      - ./artifacts/firebird-matrix/fb30:/var/lib/firebird/data

  fb40:
    image: firebirdsql/firebird:4
    platform: linux/amd64
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: firebirdadmin.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports:
      - "3040:3050"
    volumes:
      - ./artifacts/firebird-matrix/fb40:/var/lib/firebird/data

  fb50:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: firebirdadmin.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports:
      - "3055:3050"
    volumes:
      - ./artifacts/firebird-matrix/fb50:/var/lib/firebird/data
