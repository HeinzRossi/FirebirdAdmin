name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows-solution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FirebirdAdmin.sln
      - name: Build
        run: dotnet build FirebirdAdmin.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FirebirdAdmin.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'

  cross-platform-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/FirebirdAdmin.Domain.Tests/FirebirdAdmin.Domain.Tests.csproj
          - tests/FirebirdAdmin.Application.Tests/FirebirdAdmin.Application.Tests.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ${{ matrix.project }} --configuration Release
